services:
  postgres:
    image: postgres:16-alpine
    container_name: glaucomap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-glaucomap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-glaucomap_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-glaucomap_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-glaucomap} -d ${POSTGRES_DB:-glaucomap_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
